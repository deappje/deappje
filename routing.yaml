# The durable topology of this application: one entry per nanoservice, the
# messages it handles and the messages it sends. basable-messenger-gen reads
# this file at build (tools/messenger.bzl) and generates the `interfaces`
# crate (a handler trait with `handle_<snake_message>` per nanoservice, and a
# sender exposing exactly the declared `send_<snake_message>` calls) and the
# `messenger` crate (the concrete AppMessenger routing every declared pair).
#
# Semantics: a typed `response` is a strict 1:1 request (exactly one
# handler); `response: error` is sequential fail-fast fan-out; no `response`
# is a void fan-out event (0..N handlers). Every send and handle of one
# message declares the same response. A nanoservice with no `handles` is
# sends-only and is not a field of the router. The build names the YAML line
# of every violation.
#
# Messages are plain Rust structs in crates/messages. Adding a message or a
# nanoservice is an edit here; the build then tells you which methods are
# missing. The scaffolder merges new nanoservice entries; it never removes.
version: 1
messenger:
  name: AppMessenger
  rust:
    error_type: basable_core::AppError
    ctx_type: basable_core::Ctx
    uses: ["messages::*"]
nanoservices:
  # The Connect boundary: sends-only, one request per API method.
  - name: api
    sends:
      - {message: CreateGroupRequest, response: Group}
      - {message: DeleteGroupRequest, response: Group}
      - {message: DeleteAccountRequest, response: AccountDeletion}
      - {message: GetGroupRequest, response: Group}
      - {message: ListGroupsRequest, response: GroupList}
      - {message: CreateInviteRequest, response: Invite}
      - {message: AcceptInviteRequest, response: Membership}
      - {message: ListMembersRequest, response: MemberList}
      - {message: AddMemberRequest, response: Membership}
      - {message: RemoveMemberRequest, response: Membership}
      - {message: SetMemberRoleRequest, response: Membership}
      - {message: LeaveGroupRequest, response: Membership}
      - {message: RegisterDeviceRequest, response: Device}
      - {message: SetPushTokenRequest, response: Device}
      - {message: ListDevicesRequest, response: DeviceList}
      - {message: RequestGroupKeysRequest, response: KeyRequest}
      - {message: ListKeyRequestsRequest, response: KeyRequestList}
      - {message: FulfilKeyRequestRequest, response: KeyRequest}
      - {message: PublishWrappedKeysRequest, response: WrappedKeyList}
      - {message: GetWrappedKeysRequest, response: WrappedKeyList}
      - {message: RemoveDeviceRequest, response: Device}
      - {message: PushObjectsRequest, response: PushResult}
      - {message: PullChangesRequest, response: ChangeSet}
      - {message: AckSeqRequest, response: AckResult}
      - {message: GetHeadsRequest, response: HeadList}
      - {message: RequestHistoryRequest, response: HistoryRequest}
      - {message: ListHistoryRequestsRequest, response: HistoryRequestList}
      - {message: ClaimHistoryRequest, response: HistoryRequest}
      - {message: PushHistoryRequest, response: PushHistoryResult}
      - {message: PresignUploadRequest, response: UploadGrant}
      - {message: PresignDownloadRequest, response: DownloadGrant}
  - name: group
    handles:
      - {message: CreateGroupRequest, response: Group}
      - {message: GetGroupRequest, response: Group}
      - {message: ListGroupsRequest, response: GroupList}
      - {message: CreateInviteRequest, response: Invite}
      - {message: AcceptInviteRequest, response: Membership}
      - {message: ListMembersRequest, response: MemberList}
      - {message: AddMemberRequest, response: Membership}
      - {message: RemoveMemberRequest, response: Membership}
      - {message: SetMemberRoleRequest, response: Membership}
      - {message: LeaveGroupRequest, response: Membership}
      - {message: DeleteGroupRequest, response: Group}
      - {message: DeleteAccountRequest, response: AccountDeletion}
      - {message: CheckMembershipRequest, response: MembershipCheck}
    sends:
      - {message: MemberRemoved}
      - {message: PurgeGroupObjectsRequest, response: PurgeResult}
      - {message: PurgeGroupBlobsRequest, response: PurgeResult}
      - {message: PurgeGroupKeysRequest, response: PurgeResult}
      - {message: PurgeUserDevicesRequest, response: PurgeResult}
  - name: device
    handles:
      - {message: RegisterDeviceRequest, response: Device}
      - {message: SetPushTokenRequest, response: Device}
      - {message: ListDevicesRequest, response: DeviceList}
      - {message: RequestGroupKeysRequest, response: KeyRequest}
      - {message: ListKeyRequestsRequest, response: KeyRequestList}
      - {message: FulfilKeyRequestRequest, response: KeyRequest}
      - {message: PublishWrappedKeysRequest, response: WrappedKeyList}
      - {message: GetWrappedKeysRequest, response: WrappedKeyList}
      - {message: RemoveDeviceRequest, response: Device}
      - {message: GroupHeadAdvanced}
      - {message: MemberRemoved}
      - {message: HistoryRequested}
      - {message: HistoryReady}
      - {message: PurgeGroupKeysRequest, response: PurgeResult}
      - {message: PurgeUserDevicesRequest, response: PurgeResult}
    sends:
      - {message: CheckMembershipRequest, response: MembershipCheck}
      - {message: DeviceLeftGroup}
  - name: sync
    handles:
      - {message: PushObjectsRequest, response: PushResult}
      - {message: PullChangesRequest, response: ChangeSet}
      - {message: AckSeqRequest, response: AckResult}
      - {message: GetHeadsRequest, response: HeadList}
      - {message: RequestHistoryRequest, response: HistoryRequest}
      - {message: ListHistoryRequestsRequest, response: HistoryRequestList}
      - {message: ClaimHistoryRequest, response: HistoryRequest}
      - {message: PushHistoryRequest, response: PushHistoryResult}
      - {message: DeviceLeftGroup}
      - {message: PurgeGroupObjectsRequest, response: PurgeResult}
    sends:
      - {message: CheckMembershipRequest, response: MembershipCheck}
      - {message: GroupHeadAdvanced}
      - {message: ObjectDeleted}
      - {message: HistoryRequested}
      - {message: HistoryReady}
  - name: storage
    handles:
      - {message: PresignUploadRequest, response: UploadGrant}
      - {message: PresignDownloadRequest, response: DownloadGrant}
      - {message: ObjectDeleted}
      - {message: PurgeGroupBlobsRequest, response: PurgeResult}
    sends:
      - {message: CheckMembershipRequest, response: MembershipCheck}
