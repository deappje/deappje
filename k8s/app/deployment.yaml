# Wave 1: the nanoservice binary, one replica (docs/01-deappje/05-deployment.md,
# deviation 1; the frameworks are multi-replica safe by construction). The image path is LITERAL with the
# platform's tag placeholder; the workflow pins the digest by name.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: app
  annotations:
    basable.com/apply-wave: "1"
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: app
  template:
    metadata:
      labels:
        app: app
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: app
          image: registry.basable.com/abandon-above-toss/deappje
          ports:
            - name: http
              containerPort: 8080
          # The environment's buckets (nanoservices/storage): the platform
          # writes the object-storage Secret, and the app reads it whole.
          envFrom:
            - secretRef:
                name: object-storage
          env:
            - name: PORT
              value: "8080"
            # The config seed the image carries (config/BUILD.bazel).
            - name: CONFIG_SEED_DIR
              value: /config/base
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: app-postgres-app
                  key: uri
            - name: PUBLIC_BASE_URL
              value: https://TENANT_DOMAIN_PLACEHOLDER
            - name: KRATOS_PUBLIC_URL
              value: http://kratos-public:4433
            # The admin API, in-cluster and unauthenticated: the account
            # purge deletes the identity through it (nanoservices/group).
            - name: KRATOS_ADMIN_URL
              value: http://kratos-admin:4434
            # The push services (nanoservices/device). Optional on purpose:
            # a deploy does not wait for them, and until they are added
            # the app logs and skips every wake-up (clients poll heads on
            # foreground). APNS_KEY_P8 is the .p8 push key's PEM text from
            # the Apple Developer account (Keys), with its key id and the
            # team id, and the app's bundle id as the topic;
            # FCM_SERVICE_ACCOUNT_JSON is a Firebase service account's JSON
            # with the Messaging role. docs/01-deappje/05-deployment.md.
            - name: APNS_KEY_P8
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: APNS_KEY_P8
                  optional: true
            - name: APNS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: APNS_KEY_ID
                  optional: true
            - name: APNS_TEAM_ID
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: APNS_TEAM_ID
                  optional: true
            - name: APNS_BUNDLE_ID
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: APNS_BUNDLE_ID
                  optional: true
            - name: FCM_SERVICE_ACCOUNT_JSON
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: FCM_SERVICE_ACCOUNT_JSON
                  optional: true
            - name: RUST_LOG
              value: info
            # A user-supplied secret (a provider's API key, a webhook's
            # verification secret) is added here by whoever fills the code
            # that reads it: its own non-optional secretKeyRef on the
            # app-secrets Secret the editor fills per environment, so the
            # deploy waits at its secrets step until the key exists. Name the
            # key in the chat so the user can add it (docs/operations.md).
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          # CPU limits are sized to the free tier's namespace quota: the
          # platform allows the environment's CPU times 1.5 as burst (3000m
          # at 2000m) beside the vCluster control plane. App 2 x 500m,
          # Postgres 1000m, Kratos 250m leave room for a rolling update's
          # surge pod (wave 1) or a wave-0 Job (250m each); 2 x 1000m plus
          # Kratos did not even admit Kratos (first tenant deploy,
          # 2026-10-29). Requests are what is guaranteed; raise the limits
          # with the environment's CPU in .basable/config.yaml.
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 256Mi
