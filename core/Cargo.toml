# The client core: its own Cargo workspace, deliberately apart from the
# server's. Cargo unifies a crate's features across one workspace, and the
# server's uuid pulls getrandom, which has no wasm32 backend without a cfg
# the dependency graph cannot carry; the core takes its randomness from the
# shell instead (src/shell.rs) and keeps a graph that builds for every
# target it is bound to. crate_universe pins it as the `core_crates` hub
# (MODULE.bazel); dependencies are declared here and repinned with
# CARGO_BAZEL_REPIN=workspace like the server's.
[package]
name = "deappje-core"
version = "0.1.0"
edition = "2024"
rust-version = "1.98.1"
license = "UNLICENSED"
publish = false

[lib]
name = "deappje_core"
path = "src/lib.rs"

[dependencies]
# Every crate here is pure Rust, builds for wasm32-unknown-unknown and the
# phone triples, and draws no randomness of its own.
chacha20poly1305 = { version = "0.10", default-features = false, features = ["alloc"] }
x25519-dalek = { version = "2", default-features = false, features = ["static_secrets", "zeroize"] }
hkdf = "0.12"
hmac = "0.12"
sha2 = "0.10"
rand_chacha = { version = "0.3", default-features = false }
rand_core = "0.6"
uuid = { version = "1", default-features = false, features = ["v5", "serde"] }
zeroize = { version = "1", features = ["derive"] }
# Kratos's and Connect's JSON (the login flows, the protocol's errors), and
# the object types as the web client receives them.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The facade's one lock, held across the server calls of a sync; its guard
# crosses threads on the phones (the bindings' futures must), and the
# browser has none.
async-lock = "3"
# The transport seam's async method is boxed through async-trait on every
# target (uniffi's generated callback code expects it off the browser).
async-trait = "0.1"
# The note CRDT (01-architecture.md, "Notes are the exception"): a note's
# body is the combination of its note_update children, each one yrs update.
# Its fastrand takes the browser's entropy through getrandom's js feature on
# wasm32, which is the one place that crate is allowed in: the core gives
# every Doc a client id of its own generator's.
yrs = "0.28"

# The phones' bindings (05-deployment.md, "The apps"): proc-macro exports
# the generator reads from the host library; never in the wasm build, which
# speaks wasm-bindgen instead.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
uniffi = "0.32"

# The wasm build's wasm-bindgen is pinned to the version of the CLI that
# rules_rust_wasm_bindgen 0.74 runs: the bindgen format must match exactly,
# and yrs's getrandom would otherwise pull the newest. Raise both together.
[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "=0.2.121"
# The web client's bindings (src/wasm.rs): the seams as JavaScript objects,
# every Core method a Promise, the records as plain objects. js-sys and
# wasm-bindgen-futures pin the wasm-bindgen above exactly, so they move with
# it. None of them draws randomness.
js-sys = "0.3"
wasm-bindgen-futures = "0.4"
serde-wasm-bindgen = "0.6"

# The oracle the HPKE here is checked against: a reference implementation
# of the same suite, which the production core cannot use because the
# device's private key never leaves the shell's key store. Host tests only:
# its graph turns on rand_core's getrandom, which has no wasm32 build, and
# the hub resolves features per triple.
[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
hpke = { version = "0.12", default-features = false, features = ["alloc", "x25519"] }

[workspace]
# The binding generator is its own workspace: core/tools/bindgen/Cargo.toml.
exclude = ["tools/bindgen"]
