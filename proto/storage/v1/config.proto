syntax = "proto3";

package storage.v1;

import "basable/config/v1/config.proto";

// The configuration messages nanoservice `storage` declares. Each
// embeds the ConfigHeader; a reference field is a string that holds a
// #{Type:namespace:name} reference in the seed and the target's id once
// loaded. Edit the plan's configTypes, not this file.

// SlotConfiguration (id 100, public ids `slot_…`).
message SlotConfiguration {
  basable.config.v1.ConfigHeader header = 1;
  int64 max_size_bytes = 2;
}

// StorageQuotaConfiguration (id 101, public ids `squo_…`).
message StorageQuotaConfiguration {
  basable.config.v1.ConfigHeader header = 1;
  int64 max_bytes_per_168h = 2;
}
