syntax = "proto3";

package group.v1;

// GroupService: the API of nanoservice `group`. Every method needs a
// Kratos session; the caller is the session's identity, never a field.
// Ids are UUIDs as text; a time is milliseconds since the Unix epoch, UTC,
// and 0 where it is unset; a role is "admin", "member" or "viewer". A
// group's name and avatar are ciphertext in the object log, so no message
// here carries either (docs/01-deappje/02-group.md).
service GroupService {
  rpc CreateGroup(CreateGroupRequest) returns (CreateGroupResponse);
  rpc DeleteGroup(DeleteGroupRequest) returns (DeleteGroupResponse);
  rpc DeleteAccount(DeleteAccountRequest) returns (DeleteAccountResponse);
  rpc GetGroup(GetGroupRequest) returns (GetGroupResponse);
  rpc ListGroups(ListGroupsRequest) returns (ListGroupsResponse);
  rpc CreateInvite(CreateInviteRequest) returns (CreateInviteResponse);
  rpc AcceptInvite(AcceptInviteRequest) returns (AcceptInviteResponse);
  rpc ListMembers(ListMembersRequest) returns (ListMembersResponse);
  rpc AddMember(AddMemberRequest) returns (AddMemberResponse);
  rpc RemoveMember(RemoveMemberRequest) returns (RemoveMemberResponse);
  rpc SetMemberRole(SetMemberRoleRequest) returns (SetMemberRoleResponse);
  rpc LeaveGroup(LeaveGroupRequest) returns (LeaveGroupResponse);
}

// A group. deleted_at_ms is set from the moment a deletion was accepted:
// such a group answers no membership and goes when its purge finishes.
message Group {
  string id = 1;
  // Empty for a top-level group.
  string parent_group_id = 2;
  string created_by = 3;
  int64 created_at_ms = 4;
  int64 deleted_at_ms = 5;
}

// One user's membership of one group.
message Membership {
  string id = 1;
  string group_id = 2;
  string user_id = 3;
  string role = 4;
  int64 joined_at_ms = 5;
}

// An invite. The shared link is /join/<code>#<secret>; the secret never
// reaches the server.
message Invite {
  string id = 1;
  string group_id = 2;
  string code = 3;
  // The role a joiner gets: "member" or "viewer".
  string role = 4;
  string created_by = 5;
  int64 expires_at_ms = 6;
  // 0 is unbounded.
  int32 max_uses = 7;
  int32 uses = 8;
  bool revoked = 9;
}

message CreateGroupRequest {
  // Set to make a subgroup; the caller must be a member of the parent.
  string parent_group_id = 1;
}

message CreateGroupResponse {
  Group group = 1;
}

// The caller must be an admin. Starts the purge of the group and its
// subgroups; the answer is the group stamped deleted.
message DeleteGroupRequest {
  string group_id = 1;
}

message DeleteGroupResponse {
  Group group = 1;
}

// The caller deletes their own account.
message DeleteAccountRequest {}

message DeleteAccountResponse {
  // The public id of the purge driving the deletion (upr_...).
  string purge_id = 1;
}

// The caller must be a member.
message GetGroupRequest {
  string group_id = 1;
}

message GetGroupResponse {
  Group group = 1;
}

message ListGroupsRequest {}

// Every live group the caller is in, oldest first.
message ListGroupsResponse {
  repeated Group groups = 1;
}

// The caller must be an admin.
message CreateInviteRequest {
  string group_id = 1;
  // "member" or "viewer".
  string role = 2;
  int64 expires_at_ms = 3;
  // 0 is unbounded.
  int32 max_uses = 4;
}

message CreateInviteResponse {
  Invite invite = 1;
}

// The caller joins the invite's group with the invite's role. A subgroup's
// invite admits members of the parent only.
message AcceptInviteRequest {
  string code = 1;
}

message AcceptInviteResponse {
  Membership membership = 1;
}

// The caller must be a member.
message ListMembersRequest {
  string group_id = 1;
}

// Oldest membership first.
message ListMembersResponse {
  repeated Membership members = 1;
}

// Subgroups only: the caller is an admin or member of the subgroup and the
// user a member of the parent; no invite, no acceptance.
message AddMemberRequest {
  string group_id = 1;
  string user_id = 2;
  // "member" or "viewer".
  string role = 3;
}

message AddMemberResponse {
  Membership membership = 1;
}

// The caller must be an admin. Cascades to the group's subgroups.
message RemoveMemberRequest {
  string group_id = 1;
  string user_id = 2;
}

// The membership removed.
message RemoveMemberResponse {
  Membership membership = 1;
}

// The caller must be an admin. The last admin cannot be demoted while
// other members remain.
message SetMemberRoleRequest {
  string group_id = 1;
  string user_id = 2;
  // "admin", "member" or "viewer".
  string role = 3;
}

message SetMemberRoleResponse {
  Membership membership = 1;
}

// Cascades to subgroups. The last admin cannot leave while other members
// remain; the last member deletes the group instead.
message LeaveGroupRequest {
  string group_id = 1;
}

// The membership given up.
message LeaveGroupResponse {
  Membership membership = 1;
}
