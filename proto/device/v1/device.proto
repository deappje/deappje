syntax = "proto3";

package device.v1;

// DeviceService: the API of nanoservice `device`. Every method needs a
// Kratos session; the caller is the session's identity, and every request
// names the calling device, which must be the caller's. Ids are UUIDs as
// text; a time is milliseconds since the Unix epoch, UTC; a platform is
// "ios", "android" or "web"; a push provider "apns" or "fcm". Key material
// is opaque bytes the server never opens (docs/01-deappje/02-device.md).
service DeviceService {
  rpc RegisterDevice(RegisterDeviceRequest) returns (RegisterDeviceResponse);
  rpc SetPushToken(SetPushTokenRequest) returns (SetPushTokenResponse);
  rpc ListDevices(ListDevicesRequest) returns (ListDevicesResponse);
  rpc RequestGroupKeys(RequestGroupKeysRequest) returns (RequestGroupKeysResponse);
  rpc ListKeyRequests(ListKeyRequestsRequest) returns (ListKeyRequestsResponse);
  rpc FulfilKeyRequest(FulfilKeyRequestRequest) returns (FulfilKeyRequestResponse);
  rpc PublishWrappedKeys(PublishWrappedKeysRequest) returns (PublishWrappedKeysResponse);
  rpc GetWrappedKeys(GetWrappedKeysRequest) returns (GetWrappedKeysResponse);
  rpc RemoveDevice(RemoveDeviceRequest) returns (RemoveDeviceResponse);
}

// A device as its owner sees it.
message Device {
  string id = 1;
  string user_id = 2;
  // The X25519 public key, 32 bytes.
  bytes public_key = 3;
  string platform = 4;
  // Empty when the device has no push token.
  string push_provider = 5;
  string push_token = 6;
  int64 created_at_ms = 7;
  int64 last_seen_at_ms = 8;
}

// A device as another member sees it: what wrapping a key for it needs.
message DeviceInfo {
  string id = 1;
  string user_id = 2;
  bytes public_key = 3;
  string platform = 4;
}

// An open key request, with what a holder needs to verify the requesting
// device before a tap.
message KeyRequest {
  string id = 1;
  string group_id = 2;
  DeviceInfo device = 3;
  // Set when the request came through an invite: the invite and
  // HMAC-SHA256(invite_secret, device_public_key), opaque to the server.
  string invite_id = 4;
  bytes invite_tag = 5;
  int64 created_at_ms = 6;
}

// One copy of a group key, wrapped for one device (HPKE Auth mode, the
// wrapping device as sender).
message WrappedKey {
  string id = 1;
  string group_id = 2;
  int32 key_id = 3;
  string device_id = 4;
  bytes wrapped = 5;
  string wrapped_by_device = 6;
  int64 created_at_ms = 7;
  // The wrapping device's X25519 public key, 32 bytes: what opening the
  // wrap (HPKE Auth mode) needs, and a device that holds nothing yet
  // cannot list the holders to learn it. Empty when the wrapping device is
  // gone; the recipient then asks for the keys again.
  bytes wrapped_by_public_key = 8;
}

// The caller's device, by the id the device minted. A repeat refreshes the
// platform and last_seen; the public key of a device never changes.
message RegisterDeviceRequest {
  string device_id = 1;
  bytes public_key = 2;
  string platform = 3;
}

message RegisterDeviceResponse {
  Device device = 1;
}

// An empty token clears the device's push token.
message SetPushTokenRequest {
  string device_id = 1;
  string push_provider = 2;
  string push_token = 3;
}

message SetPushTokenResponse {
  Device device = 1;
}

// The devices holding a key for the group, so the calling device, a
// holder itself, can wrap for them.
message ListDevicesRequest {
  string device_id = 1;
  string group_id = 2;
}

message ListDevicesResponse {
  repeated DeviceInfo devices = 1;
}

// The calling device, whose user is a member, asks the holders for the
// group's keys; every holder device is woken.
message RequestGroupKeysRequest {
  string device_id = 1;
  string group_id = 2;
  string invite_id = 3;
  bytes invite_tag = 4;
}

message RequestGroupKeysResponse {
  KeyRequest request = 1;
}

// The open requests in the groups the calling device holds a key for.
message ListKeyRequestsRequest {
  string device_id = 1;
}

message ListKeyRequestsResponse {
  repeated KeyRequest requests = 1;
}

// One wrap handed over by a fulfilment.
message WrappedKeyInput {
  int32 key_id = 1;
  bytes wrapped = 2;
}

// The calling device, a holder, hands the requesting device the group's
// keys, one wrap per key id. The caller must be an admin or member unless
// the requesting device is their own.
message FulfilKeyRequestRequest {
  string device_id = 1;
  string request_id = 2;
  repeated WrappedKeyInput keys = 3;
}

message FulfilKeyRequestResponse {
  KeyRequest request = 1;
}

// One wrap of a published key, for one device.
message WrapFor {
  string device_id = 1;
  bytes wrapped = 2;
}

// The calling device publishes one group key wrapped for each listed
// device: the first key of a group for itself, a rotation for every holder
// of the previous key, a subgroup's key for the parent's holders. A key id
// already published by another device is refused.
message PublishWrappedKeysRequest {
  string device_id = 1;
  string group_id = 2;
  int32 key_id = 3;
  repeated WrapFor wraps = 4;
}

// What landed: a wrap for a device whose user is not a member, or that
// does not hold the previous key, is dropped.
message PublishWrappedKeysResponse {
  repeated WrappedKey keys = 1;
}

// Every key wrapped for the calling device, or those of one group.
message GetWrappedKeysRequest {
  string device_id = 1;
  string group_id = 2;
}

message GetWrappedKeysResponse {
  repeated WrappedKey keys = 1;
}

// The owner drops one of their devices with its keys and requests.
message RemoveDeviceRequest {
  string device_id = 1;
}

message RemoveDeviceResponse {
  Device device = 1;
}
